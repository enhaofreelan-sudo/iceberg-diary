<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发者中控台 - 冰山日记</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E8A4B8;
            --primary-dark: #D48A9F;
            --primary-light: rgba(232, 164, 184, 0.12);
            --secondary: #A8D5E5;
            --secondary-dark: #7BBDD4;
            --accent: #F5D5A0;
            --accent-dark: #E8C078;
            --bg-light: #FFF5F7;
            --bg-warm: #FFFAF5;
            --bg-gradient: linear-gradient(135deg, #FFF5F7 0%, #FFFAF5 50%, #F5F0FF 100%);
            --surface: #FFFFFF;
            --text-dark: #2D2430;
            --text-mid: #5D4E60;
            --text-light: #8B7B8E;
            --border: #E0D8E3;
            --shadow: rgba(93, 78, 96, 0.08);
            --shadow-strong: rgba(93, 78, 96, 0.15);
            --success: #66BB6A;
            --error: #EF5350;
            --warning: #FFA726;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* ===================== 访问控制遮罩 ===================== */
        .access-denied {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-gradient);
            z-index: 9999;
            justify-content: center; align-items: center;
            flex-direction: column; gap: 16px;
        }
        .access-denied.active { display: flex; }
        .access-denied .icon { font-size: 64px; }
        .access-denied .title { font-size: 20px; font-weight: 600; color: var(--text-dark); }
        .access-denied .desc { font-size: 14px; color: var(--text-light); text-align: center; line-height: 1.6; }

        /* ===================== 顶部导航栏 ===================== */
        .topbar {
            background: var(--surface);
            height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 16px var(--shadow);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(232, 164, 184, 0.15);
        }
        .topbar-left {
            display: flex; align-items: center; gap: 12px;
        }
        .topbar-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 3px 10px rgba(232, 164, 184, 0.3);
        }
        .topbar-title {
            font-size: 16px; font-weight: 600; color: var(--text-dark);
        }
        .topbar-badge {
            font-size: 11px; font-weight: 500;
            padding: 2px 8px; border-radius: 6px;
            background: var(--primary-light); color: var(--primary-dark);
        }
        .topbar-right {
            display: flex; align-items: center; gap: 16px;
        }
        .status-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 500;
            background: #f5f5f5; color: var(--text-light);
            transition: all 0.4s ease;
        }
        .status-pill.online { background: #E8F5E9; color: #2E7D32; }
        .status-pill.offline { background: #FFEBEE; color: #C62828; }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #bbb;
            transition: background 0.4s ease;
        }
        .status-pill.online .status-dot { background: var(--success); animation: pulse 2s infinite; }
        .status-pill.offline .status-dot { background: var(--error); }
        .port-tag {
            font-size: 12px; color: var(--text-light);
            font-family: 'SF Mono', 'Menlo', monospace;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===================== 主容器 ===================== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 24px 60px;
        }

        /* ===================== 区块标题 ===================== */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 18px;
        }
        .section-title {
            font-size: 17px; font-weight: 600; color: var(--text-dark);
            display: flex; align-items: center; gap: 8px;
        }
        .section-title .emoji { font-size: 20px; }
        .section-count {
            font-size: 12px; color: var(--text-light); font-weight: 400;
        }
        .section-action {
            font-size: 13px; color: var(--primary-dark); cursor: pointer;
            font-weight: 500; border: none; background: none;
            transition: opacity 0.2s;
        }
        .section-action:hover { opacity: 0.7; }

        /* ===================== 页面预览卡片网格 ===================== */
        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }
        .page-card {
            background: var(--surface);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: cardFadeIn 0.5s ease forwards;
            opacity: 0;
        }
        .page-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px var(--shadow-strong);
        }
        .page-card-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(232, 164, 184, 0.1);
        }
        .page-card-info {
            display: flex; align-items: center; gap: 10px;
        }
        .page-card-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .page-card-icon.login { background: linear-gradient(135deg, #A8D5E5, #7BBDD4); }
        .page-card-icon.index { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        .page-card-icon.teacher { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); }
        .page-card-icon.default { background: linear-gradient(135deg, #C5CAE9, #9FA8DA); }

        .page-card-name {
            font-size: 14px; font-weight: 600; color: var(--text-dark);
        }
        .page-card-file {
            font-size: 11px; color: var(--text-light);
            font-family: 'SF Mono', 'Menlo', monospace;
        }
        .page-card-actions {
            display: flex; gap: 6px;
        }
        .btn-icon {
            width: 30px; height: 30px;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--surface); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-icon:hover { border-color: var(--primary); background: var(--primary-light); }
        .btn-icon[title]:hover::after {
            content: attr(title);
        }

        /* iframe 预览容器 */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 420px;
            overflow: hidden;
            background: #fafafa;
        }
        .iframe-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 430px;
            height: 840px;
            border: none;
            transform-origin: top left;
            pointer-events: none;
        }
        .iframe-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            cursor: pointer; z-index: 2;
        }
        .iframe-loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px; color: var(--text-light);
            display: flex; align-items: center; gap: 8px;
        }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .page-card-footer {
            padding: 10px 18px;
            border-top: 1px solid rgba(232, 164, 184, 0.1);
            display: flex; align-items: center; justify-content: space-between;
        }
        .page-card-role {
            font-size: 11px; font-weight: 500;
            padding: 2px 8px; border-radius: 4px;
        }
        .role-parent { background: #E8F5E9; color: #2E7D32; }
        .role-teacher { background: #FFF3E0; color: #E65100; }
        .role-public { background: #E3F2FD; color: #1565C0; }
        .role-unknown { background: #F5F5F5; color: #999; }

        .btn-open {
            font-size: 12px; font-weight: 500;
            padding: 5px 14px; border-radius: 8px;
            border: 1px solid var(--primary);
            background: var(--surface); color: var(--primary-dark);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-open:hover { background: var(--primary); color: white; }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===================== API 检测面板 ===================== */
        .api-panel {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px var(--shadow);
        }
        .api-table {
            width: 100%;
            border-collapse: collapse;
        }
        .api-table th, .api-table td {
            padding: 10px 14px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid rgba(232, 164, 184, 0.1);
        }
        .api-table th {
            color: var(--text-light);
            font-weight: 500;
            font-size: 12px;
        }
        .api-table td:first-child {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            color: var(--text-mid);
        }
        .api-status {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 3px 10px; border-radius: 6px;
            font-size: 12px; font-weight: 500;
        }
        .api-status.ok { background: #E8F5E9; color: #2E7D32; }
        .api-status.fail { background: #FFEBEE; color: #C62828; }
        .api-status.pending { background: #F5F5F5; color: #999; }
        .api-time {
            font-size: 12px; color: var(--text-light);
            font-family: 'SF Mono', 'Menlo', monospace;
        }
        .btn-ping {
            font-size: 12px; font-weight: 500;
            padding: 4px 12px; border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface); color: var(--text-mid);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-ping:hover { border-color: var(--primary); color: var(--primary-dark); }
        .btn-ping:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ping-all {
            font-size: 13px; font-weight: 500;
            padding: 6px 16px; border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; cursor: pointer;
            transition: all 0.3s;
        }
        .btn-ping-all:hover { opacity: 0.85; }
        .btn-ping-all:active { transform: translateY(1px); }

        /* ===================== 空状态 ===================== */
        .empty-state {
            text-align: center; padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state .text { font-size: 14px; }

        /* ===================== 响应式 ===================== */
        @media (max-width: 768px) {
            .container { padding: 20px 16px 40px; }
            .page-grid { grid-template-columns: 1fr; }
            .topbar { padding: 0 16px; }
            .topbar-title { font-size: 14px; }
            .topbar-badge { display: none; }
            .port-tag { display: none; }
            .api-table { font-size: 12px; }
            .api-table th, .api-table td { padding: 8px 10px; }
        }
    </style>
</head>
<body>

<!-- 访问控制 -->
<div class="access-denied" id="accessDenied">
    <div class="icon">🔒</div>
    <div class="title">仅限本地访问</div>
    <div class="desc">开发者中控台仅在本地环境可用<br>请通过 127.0.0.1 或 localhost 访问</div>
</div>

<!-- 顶部导航 -->
<div class="topbar">
    <div class="topbar-left">
        <div class="topbar-icon">🏔️</div>
        <span class="topbar-title">冰山日记 · 开发者中控台</span>
        <span class="topbar-badge">DEV</span>
    </div>
    <div class="topbar-right">
        <span class="port-tag" id="portTag">:8900</span>
        <div class="status-pill" id="statusPill">
            <div class="status-dot"></div>
            <span id="statusText">检测中...</span>
        </div>
    </div>
</div>

<!-- 主容器 -->
<div class="container" id="mainContainer">

    <!-- 页面预览区 -->
    <div class="section-header">
        <div class="section-title">
            <span class="emoji">📱</span>
            页面预览
            <span class="section-count" id="pageCount"></span>
        </div>
        <button class="section-action" onclick="refreshPages()">刷新页面</button>
    </div>
    <div class="page-grid" id="pageGrid">
        <div class="empty-state" id="pageLoading">
            <div class="icon">⏳</div>
            <div class="text">正在扫描页面...</div>
        </div>
    </div>

    <!-- API 检测区 -->
    <div class="section-header">
        <div class="section-title">
            <span class="emoji">🔌</span>
            接口检测
        </div>
        <button class="btn-ping-all" onclick="pingAll()">全部检测</button>
    </div>
    <div class="api-panel">
        <table class="api-table">
            <thead>
                <tr>
                    <th>端点</th>
                    <th>说明</th>
                    <th>状态</th>
                    <th>耗时</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="apiTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    // ===================== 配置 =====================

    // 已知页面元数据映射（未命中则使用默认值）
    const PAGE_META = {
        'login.html':   { name: '登录页',    icon: '🔐', iconClass: 'login',   role: '公共入口', roleClass: 'role-public' },
        'index.html':   { name: '冰山日记',  icon: '🏔️', iconClass: 'index',   role: '家长端',   roleClass: 'role-parent' },
        'teacher.html': { name: '教师后台',  icon: '👨‍🏫', iconClass: 'teacher', role: '教师端',   roleClass: 'role-teacher' },
    };

    const API_ENDPOINTS = [
        { path: '/api/health',            desc: '健康检查' },
        { path: '/api/teachers-options',  desc: '老师选项列表' },
        { path: '/api/dev/pages',         desc: '页面扫描' },
    ];

    // ===================== 访问控制 =====================
    (function checkAccess() {
        const h = location.hostname;
        if (h !== '127.0.0.1' && h !== 'localhost' && h !== '0.0.0.0') {
            document.getElementById('accessDenied').classList.add('active');
            document.getElementById('mainContainer').style.display = 'none';
            return;
        }
        init();
    })();

    // ===================== 初始化 =====================
    function init() {
        // 显示端口号
        document.getElementById('portTag').textContent = ':' + location.port;
        // 启动服务状态轮询
        checkHealth();
        setInterval(checkHealth, 10000);
        // 加载页面列表
        refreshPages();
        // 渲染 API 检测表
        renderApiTable();
    }

    // ===================== 服务状态检测 =====================
    async function checkHealth() {
        const pill = document.getElementById('statusPill');
        const text = document.getElementById('statusText');
        try {
            const resp = await fetch('/api/health', { signal: AbortSignal.timeout(5000) });
            if (resp.ok) {
                pill.className = 'status-pill online';
                text.textContent = '服务在线';
            } else {
                throw new Error();
            }
        } catch {
            pill.className = 'status-pill offline';
            text.textContent = '服务离线';
        }
    }

    // ===================== 页面扫描与渲染 =====================
    async function refreshPages() {
        const grid = document.getElementById('pageGrid');
        grid.innerHTML = '<div class="empty-state" id="pageLoading"><div class="icon">⏳</div><div class="text">正在扫描页面...</div></div>';

        try {
            const resp = await fetch('/api/dev/pages');
            const data = await resp.json();
            const pages = data.pages || [];

            if (pages.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div class="text">未发现任何页面</div></div>';
                document.getElementById('pageCount').textContent = '';
                return;
            }

            document.getElementById('pageCount').textContent = `共 ${pages.length} 个`;
            grid.innerHTML = '';

            pages.forEach((filename, idx) => {
                const meta = PAGE_META[filename] || {
                    name: filename.replace('.html', ''),
                    icon: '📄',
                    iconClass: 'default',
                    role: '其他',
                    roleClass: 'role-unknown'
                };

                const card = document.createElement('div');
                card.className = 'page-card';
                card.style.animationDelay = `${idx * 0.1}s`;

                // 计算 iframe 缩放比例（容器宽度 / iframe 原始宽度）
                // 由于 CSS grid 宽度动态变化，使用 JS 在 resize 时处理
                card.innerHTML = `
                    <div class="page-card-header">
                        <div class="page-card-info">
                            <div class="page-card-icon ${meta.iconClass}">${meta.icon}</div>
                            <div>
                                <div class="page-card-name">${meta.name}</div>
                                <div class="page-card-file">${filename}</div>
                            </div>
                        </div>
                        <div class="page-card-actions">
                            <button class="btn-icon" title="刷新预览" onclick="reloadIframe(this, '${filename}')">🔄</button>
                        </div>
                    </div>
                    <div class="iframe-wrapper" data-page="${filename}">
                        <div class="iframe-loading"><div class="spinner"></div>加载中...</div>
                        <div class="iframe-overlay" onclick="window.open('/${filename}', '_blank')"></div>
                    </div>
                    <div class="page-card-footer">
                        <span class="page-card-role ${meta.roleClass}">${meta.role}</span>
                        <button class="btn-open" onclick="window.open('/${filename}', '_blank')">新标签页打开 ↗</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 延迟加载 iframe 以避免同时请求过多
            setTimeout(() => loadIframes(), 300);

        } catch (err) {
            grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">页面扫描失败，请检查服务状态</div></div>';
        }
    }

    function loadIframes() {
        const wrappers = document.querySelectorAll('.iframe-wrapper');
        wrappers.forEach((wrapper, idx) => {
            setTimeout(() => {
                const page = wrapper.dataset.page;
                const iframe = document.createElement('iframe');
                iframe.src = '/' + page;
                iframe.onload = () => {
                    const loading = wrapper.querySelector('.iframe-loading');
                    if (loading) loading.style.display = 'none';
                    scaleIframe(wrapper, iframe);
                };
                wrapper.appendChild(iframe);
            }, idx * 200);
        });

        // 监听窗口大小变化以重新计算缩放
        window.addEventListener('resize', debounce(rescaleAllIframes, 200));
    }

    function scaleIframe(wrapper, iframe) {
        const wrapperWidth = wrapper.clientWidth;
        const scale = wrapperWidth / 430;
        iframe.style.transform = `scale(${scale})`;
        // 调整容器高度以匹配缩放后的 iframe
        wrapper.style.height = (840 * scale) + 'px';
    }

    function rescaleAllIframes() {
        document.querySelectorAll('.iframe-wrapper').forEach(wrapper => {
            const iframe = wrapper.querySelector('iframe');
            if (iframe) scaleIframe(wrapper, iframe);
        });
    }

    function reloadIframe(btn, filename) {
        const card = btn.closest('.page-card');
        const wrapper = card.querySelector('.iframe-wrapper');
        const oldIframe = wrapper.querySelector('iframe');
        if (oldIframe) {
            const loading = wrapper.querySelector('.iframe-loading');
            if (loading) loading.style.display = 'flex';
            oldIframe.src = '/' + filename + '?t=' + Date.now();
            oldIframe.onload = () => {
                if (loading) loading.style.display = 'none';
            };
        }
    }

    // ===================== API 检测 =====================
    function renderApiTable() {
        const tbody = document.getElementById('apiTableBody');
        tbody.innerHTML = API_ENDPOINTS.map((ep, i) => `
            <tr data-api-idx="${i}">
                <td>${ep.path}</td>
                <td>${ep.desc}</td>
                <td><span class="api-status pending" id="apiStatus${i}">待检测</span></td>
                <td><span class="api-time" id="apiTime${i}">-</span></td>
                <td><button class="btn-ping" onclick="pingOne(${i})">检测</button></td>
            </tr>
        `).join('');
    }

    async function pingOne(idx) {
        const ep = API_ENDPOINTS[idx];
        const statusEl = document.getElementById('apiStatus' + idx);
        const timeEl = document.getElementById('apiTime' + idx);
        const btn = document.querySelector(`tr[data-api-idx="${idx}"] .btn-ping`);

        statusEl.className = 'api-status pending';
        statusEl.textContent = '检测中...';
        timeEl.textContent = '-';
        if (btn) btn.disabled = true;

        const start = performance.now();
        try {
            const resp = await fetch(ep.path, { signal: AbortSignal.timeout(8000) });
            const elapsed = Math.round(performance.now() - start);
            if (resp.ok) {
                statusEl.className = 'api-status ok';
                statusEl.textContent = resp.status + ' OK';
            } else {
                statusEl.className = 'api-status fail';
                statusEl.textContent = resp.status + ' ERR';
            }
            timeEl.textContent = elapsed + 'ms';
        } catch {
            const elapsed = Math.round(performance.now() - start);
            statusEl.className = 'api-status fail';
            statusEl.textContent = '超时/失败';
            timeEl.textContent = elapsed + 'ms';
        }
        if (btn) btn.disabled = false;
    }

    async function pingAll() {
        for (let i = 0; i < API_ENDPOINTS.length; i++) {
            await pingOne(i);
        }
    }

    // ===================== 工具函数 =====================
    function debounce(fn, ms) {
        let timer;
        return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), ms);
        };
    }
</script>
